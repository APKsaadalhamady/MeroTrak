<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeroTrack - نظام متابعة طلبات الميروبينيم</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #f4f6f9; font-family: system-ui, -apple-system, sans-serif; padding-bottom: 30px; }
        .header-title { background: linear-gradient(135deg, #0d6efd, #0a58ca); color: white; padding: 20px 0; margin-bottom: 25px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .card { border-radius: 12px; border: none; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .status-badge { font-size: 0.85rem; padding: 6px 12px; border-radius: 50px; }
        .status-pending { background-color: #fff3cd; color: #664d03; }
        .status-done { background-color: #d1e7dd; color: #0f5132; }
        .status-rejected { background-color: #f8d7da; color: #842029; }
    </style>
</head>
<body>

    <div class="header-title text-center">
        <h3><i class="bi bi-capsule"></i> نظام متابعة طلبات الميروبينيم (MeroTrack)</h3>
        <p class="mb-0 fs-6">التنسيق بين الصيدلية الداخلية ومختبر الأحياء المجهرية</p>
    </div>

    <div class="container">
        <!-- أزرار إدارة الرموز السرية -->
        <div class="text-end mb-3">
            <button class="btn btn-sm btn-outline-dark me-1" onclick="changeLabPasscode()">
                <i class="bi bi-key-fill"></i> تغيير رمز المختبر
            </button>
            <button class="btn btn-sm btn-outline-danger" onclick="changeDeletePasscode()">
                <i class="bi bi-shield-lock-fill"></i> تغيير رمز الحذف
            </button>
        </div>

        <!-- قسم إضافة طلب جديد -->
        <div class="card p-3 mb-4">
            <h5 class="card-title text-primary mb-3"><i class="bi bi-plus-circle-fill"></i> إدخال طلب جديد (الصيدلية)</h5>
            <form id="orderForm" class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">اسم المريض الثلاثي</label>
                    <input type="text" id="patientName" class="form-control" placeholder="أدخل اسم المريض" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">الردهة / القسم</label>
                    <input type="text" id="ward" class="form-control" placeholder="مثال: العناية المركزة، الباطنية..." required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">تاريخ الطلب (يوم/شهر/سنة)</label>
                    <input type="date" id="orderDate" class="form-control" required>
                </div>
                <div class="col-12 text-end">
                    <button type="submit" class="btn btn-primary px-4"><i class="bi bi-send-fill"></i> إرسال الطلب</button>
                </div>
            </form>
        </div>

        <!-- قسم البحث والفلترة -->
        <div class="card p-3 mb-4 bg-white">
            <h5 class="card-title text-secondary mb-3"><i class="bi bi-search"></i> البحث والفلترة</h5>
            <div class="row g-2">
                <div class="col-md-3">
                    <label class="form-label fs-7 text-muted mb-1">اسم المريض</label>
                    <input type="text" id="searchInput" class="form-control" placeholder="ابحث باسم المريض...">
                </div>
                <div class="col-md-3">
                    <label class="form-label fs-7 text-muted mb-1">الردهة</label>
                    <input type="text" id="wardFilter" class="form-control" placeholder="فلترة حسب الردهة...">
                </div>
                <div class="col-md-2">
                    <label class="form-label fs-7 text-muted mb-1">من تاريخ</label>
                    <input type="date" id="startDateFilter" class="form-control">
                </div>
                <div class="col-md-2">
                    <label class="form-label fs-7 text-muted mb-1">إلى تاريخ</label>
                    <input type="date" id="endDateFilter" class="form-control">
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button class="btn btn-outline-secondary w-100" onclick="resetFilters()"><i class="bi bi-arrow-counterclockwise"></i> إعادة ضبط</button>
                </div>
            </div>
        </div>

        <!-- قائمة الطلبات -->
        <div class="card p-3">
            <h5 class="card-title text-dark mb-3"><i class="bi bi-list-task"></i> سجل الطلبات</h5>
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>اسم المريض</th>
                            <th>الردهة</th>
                            <th>تاريخ الطلب</th>
                            <th>حالة العينة (المختبر)</th>
                            <th>ملاحظات المختبر</th>
                            <th>إجراءات المختبر</th>
                        </tr>
                    </thead>
                    <tbody id="ordersTableBody">
                        <tr><td colspan="6" class="text-center text-muted">جاري تحميل البيانات...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc, getDoc, setDoc, query, orderBy } 
        from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // بيانات مشروعك المخصصة من Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyCqm16V1ESpEbZZ8SJA8GTzFdtbexrPwaE",
            authDomain: "meropenem-app.firebaseapp.com",
            projectId: "meropenem-app",
            storageBucket: "meropenem-app.firebasestorage.app",
            messagingSenderId: "387581088853",
            appId: "1:387581088853:web:2a4e1a37c8372bf20af0dc"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const ordersRef = collection(db, "meropenem_orders");
        const settingsRef = doc(db, "settings", "lab_config");

        let currentLabPasscode = "1234";    // الرمز الافتراضي للمختبر
        let currentDeletePasscode = "9999"; // الرمز الافتراضي الخاص بالحذف

        // الاستماع المباشر لتغييرات الرموز السرية من Firebase
        onSnapshot(settingsRef, (docSnap) => {
            if (docSnap.exists()) {
                const data = docSnap.data();
                currentLabPasscode = data.passcode || "1234";
                currentDeletePasscode = data.deletePasscode || "9999";
            } else {
                setDoc(settingsRef, { passcode: "1234", deletePasscode: "9999" });
            }
        });

        // تغيير رمز المختبر (التأكيد/النفي)
        window.changeLabPasscode = async () => {
            const oldPass = prompt('الرجاء إدخال رمز المختبر الحالي:');
            if (oldPass === null) return;

            if (oldPass !== currentLabPasscode) {
                alert('❌ رمز المختبر الحالي غير صحيح!');
                return;
            }

            const newPass = prompt('أدخل الرمز الجديد للمختبر:');
            if (!newPass || newPass.trim() === "") {
                alert('❌ لا يمكن ترك الرمز فارغاً!');
                return;
            }

            try {
                await updateDoc(settingsRef, { passcode: newPass.trim() });
                alert('✅ تم تغيير رمز المختبر بنجاح!');
            } catch (err) {
                alert('حدث خطأ أثناء التغيير: ' + err.message);
            }
        };

        // تغيير رمز الحذف المخصص
        window.changeDeletePasscode = async () => {
            const oldPass = prompt('الرجاء إدخال رمز الحذف الحالي:');
            if (oldPass === null) return;

            if (oldPass !== currentDeletePasscode) {
                alert('❌ رمز الحذف الحالي غير صحيح!');
                return;
            }

            const newPass = prompt('أدخل رمز الحذف الجديد:');
            if (!newPass || newPass.trim() === "") {
                alert('❌ لا يمكن ترك الرمز فارغاً!');
                return;
            }

            try {
                await updateDoc(settingsRef, { deletePasscode: newPass.trim() });
                alert('✅ تم تغيير رمز الحذف بنجاح!');
            } catch (err) {
                alert('حدث خطأ أثناء التغيير: ' + err.message);
            }
        };

        // ضبط تاريخ اليوم التلقائي بفرمتة (YYYY-MM-DD)
        document.getElementById('orderDate').value = new Date().toISOString().split('T')[0];

        let allOrders = [];

        // إضافة طلب جديد
        document.getElementById('orderForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('patientName').value.trim();
            const ward = document.getElementById('ward').value.trim();
            const date = document.getElementById('orderDate').value;

            try {
                await addDoc(ordersRef, {
                    patientName: name,
                    ward: ward,
                    orderDate: date,
                    status: 'pending', // pending, confirmed, rejected
                    notes: '',
                    createdAt: new Date()
                });
                document.getElementById('orderForm').reset();
                document.getElementById('orderDate').value = new Date().toISOString().split('T')[0];
                alert('تمت إضافة الطلب بنجاح');
            } catch (err) {
                alert('حدث خطأ أثناء الإضافة: ' + err.message);
            }
        });

        // استماع وتحديث البيانات لحظياً
        const q = query(ordersRef, orderBy("createdAt", "desc"));
        onSnapshot(q, (snapshot) => {
            allOrders = [];
            snapshot.forEach((doc) => {
                allOrders.push({ id: doc.id, ...doc.data() });
            });
            renderOrders();
        });

        // عرض البيانات مع الفلترة المتقدمة (بالاسم، الردهة، والتاريخ من/إلى)
        window.renderOrders = () => {
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            const wardVal = document.getElementById('wardFilter').value.toLowerCase();
            const startDateVal = document.getElementById('startDateFilter').value;
            const endDateVal = document.getElementById('endDateFilter').value;

            const filtered = allOrders.filter(o => {
                const matchName = o.patientName.toLowerCase().includes(searchVal);
                const matchWard = o.ward.toLowerCase().includes(wardVal);
                
                // فلترة نطاق التاريخ
                let matchDate = true;
                if (startDateVal && endDateVal) {
                    matchDate = o.orderDate >= startDateVal && o.orderDate <= endDateVal;
                } else if (startDateVal) {
                    matchDate = o.orderDate >= startDateVal;
                } else if (endDateVal) {
                    matchDate = o.orderDate <= endDateVal;
                }

                return matchName && matchWard && matchDate;
            });

            const tbody = document.getElementById('ordersTableBody');
            if (filtered.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">لا توجد نتائج مطابقة</td></tr>';
                return;
            }

            tbody.innerHTML = filtered.map(o => {
                let statusBadge = '<span class="status-badge status-pending"><i class="bi bi-clock"></i> بانتظار العينة</span>';
                if (o.status === 'confirmed') statusBadge = '<span class="status-badge status-done"><i class="bi bi-check-circle"></i> تم أخذ العينة ✅</span>';
                if (o.status === 'rejected') statusBadge = '<span class="status-badge status-rejected"><i class="bi bi-x-circle"></i> لم ترسل عينة ❌</span>';

                // تنسيق التواريخ لعرض (يوم/شهر/سنة)
                const dateParts = o.orderDate.split('-');
                const formattedDate = dateParts.length === 3 ? `${dateParts[2]}/${dateParts[1]}/${dateParts[0]}` : o.orderDate;

                return `
                    <tr>
                        <td><strong>${o.patientName}</strong></td>
                        <td><span class="badge bg-secondary">${o.ward}</span></td>
                        <td><small class="fw-bold">${formattedDate}</small></td>
                        <td>${statusBadge}</td>
                        <td><small class="text-muted">${o.notes || '-'}</small></td>
                        <td>
                            <button class="btn btn-sm btn-success me-1" onclick="updateStatus('${o.id}', 'confirmed')"><i class="bi bi-check"></i> تأكيد</button>
                            <button class="btn btn-sm btn-danger me-1" onclick="updateStatus('${o.id}', 'rejected')"><i class="bi bi-x"></i> نفي</button>
                            <button class="btn btn-sm btn-outline-danger" onclick="deleteOrder('${o.id}', '${o.patientName}')"><i class="bi bi-trash"></i> حذف</button>
                        </td>
                    </tr>
                `;
            }).join('');
        };

        // تحديث حالة العينة من قبل المختبر (يتطلب رمز المختبر)
        window.updateStatus = async (id, status) => {
            const enteredPass = prompt('الرجاء إدخال رمز التحقق الخاص بمختبر المايكروبايولوجي:');
            if (enteredPass === null) return;

            if (enteredPass !== currentLabPasscode) {
                alert('❌ رمز التحقق غير صحيح! لا تملك صلاحية تعديل موقف العينة.');
                return;
            }

            const note = prompt(status === 'confirmed' ? 'أدخل ملاحظة (اختياري - مثل: تم سحب عينة دم):' : 'سبب عدم التنزيل/الإرسال (اختياري):');
            if (note === null) return;

            try {
                const orderDoc = doc(db, "meropenem_orders", id);
                await updateDoc(orderDoc, {
                    status: status,
                    notes: note
                });
                alert('✅ تم تحديث موقف العينة بنجاح');
            } catch (err) {
                alert('حدث خطأ أثناء التحديث: ' + err.message);
            }
        };

        // حذف الطلب مع التأكيد بطلب "كود الحذف المخصص"
        window.deleteOrder = async (id, patientName) => {
            const confirmDelete = confirm(`هل أنت متأكد حقاً من حذف سجل المريض: (${patientName})؟\nلا يمكن استرجاع البيانات بعد الحذف!`);
            if (!confirmDelete) return;

            const enteredPass = prompt('⚠️ إجراء حساس: أدخل "رمز الحذف المخصص" لتأكيد مسح هذا السجل:');
            if (enteredPass === null) return;

            if (enteredPass !== currentDeletePasscode) {
                alert('❌ رمز الحذف غير صحيح! تم إلغاء عملية المسح.');
                return;
            }

            try {
                const orderDoc = doc(db, "meropenem_orders", id);
                await deleteDoc(orderDoc);
                alert('🗑️ تم حذف السجل بنجاح');
            } catch (err) {
                alert('حدث خطأ أثناء الحذف: ' + err.message);
            }
        };

        // أحداث البحث والفلترة اللحظية
        document.getElementById('searchInput').addEventListener('input', renderOrders);
        document.getElementById('wardFilter').addEventListener('input', renderOrders);
        document.getElementById('startDateFilter').addEventListener('change', renderOrders);
        document.getElementById('endDateFilter').addEventListener('change', renderOrders);

        window.resetFilters = () => {
            document.getElementById('searchInput').value = '';
            document.getElementById('wardFilter').value = '';
            document.getElementById('startDateFilter').value = '';
            document.getElementById('endDateFilter').value = '';
            renderOrders();
        };
    </script>
</body>
</html>
