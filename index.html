<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام متابعة طلبات الميروبينيم</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #f4f6f9; font-family: system-ui, -apple-system, sans-serif; padding-bottom: 30px; }
        .header-title { background: linear-gradient(135deg, #0d6efd, #0a58ca); color: white; padding: 20px 0; margin-bottom: 25px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .card { border-radius: 12px; border: none; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .status-badge { font-size: 0.85rem; padding: 6px 12px; border-radius: 50px; }
        .status-pending { background-color: #fff3cd; color: #664d03; }
        .status-done { background-color: #d1e7dd; color: #0f5132; }
        .status-rejected { background-color: #f8d7da; color: #842029; }
    </style>
</head>
<body>

    <div class="header-title text-center">
        <h3><i class="bi bi-capsule"></i> نظام متابعة طلبات الميروبينيم</h3>
        <p class="mb-0 fs-6">التنسيق بين الصيدلية الداخلية ومختبر الأحياء المجهرية</p>
    </div>

    <div class="container">
        <!-- قسم إضافة طلب جديد -->
        <div class="card p-3 mb-4">
            <h5 class="card-title text-primary mb-3"><i class="bi bi-plus-circle-fill"></i> إدخال طلب جديد (الصيدلية)</h5>
            <form id="orderForm" class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">اسم المريض الثلاثي</label>
                    <input type="text" id="patientName" class="form-control" placeholder="أدخل اسم المريض" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">الردهة / القسم</label>
                    <input type="text" id="ward" class="form-control" placeholder="مثال: العناية المركزة، الباطنية..." required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">تاريخ ووقت الطلب</label>
                    <input type="datetime-local" id="orderDate" class="form-control" required>
                </div>
                <div class="col-12 text-end">
                    <button type="submit" class="btn btn-primary px-4"><i class="bi bi-send-fill"></i> إرسال الطلب</button>
                </div>
            </form>
        </div>

        <!-- قسم البحث والفلترة -->
        <div class="card p-3 mb-4 bg-white">
            <h5 class="card-title text-secondary mb-3"><i class="bi bi-search"></i> البحث والفلترة</h5>
            <div class="row g-2">
                <div class="col-md-4">
                    <input type="text" id="searchInput" class="form-control" placeholder="ابحث باسم المريض...">
                </div>
                <div class="col-md-3">
                    <input type="text" id="wardFilter" class="form-control" placeholder="فلترة حسب الردهة...">
                </div>
                <div class="col-md-3">
                    <input type="date" id="dateFilter" class="form-control">
                </div>
                <div class="col-md-2">
                    <button class="btn btn-outline-secondary w-100" onclick="resetFilters()"><i class="bi bi-arrow-counterclockwise"></i> إعادة ضبط</button>
                </div>
            </div>
        </div>

        <!-- قائمة الطلبات -->
        <div class="card p-3">
            <h5 class="card-title text-dark mb-3"><i class="bi bi-list-task"></i> سجل الطلبات</h5>
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>اسم المريض</th>
                            <th>الردهة</th>
                            <th>تاريخ الطلب</th>
                            <th>حالة العينة (المختبر)</th>
                            <th>ملاحظات المختبر</th>
                            <th>إجراءات المختبر</th>
                        </tr>
                    </thead>
                    <tbody id="ordersTableBody">
                        <tr><td colspan="6" class="text-center text-muted">جاري تحميل البيانات...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, query, orderBy } 
        from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ⚠️ استبدل القيم التالية ببيانات مشروعك من Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyCqm16V1ESpEbZZ8SJA8GTzFdtbexrPwaE",
            authDomain: "meropenem-app.firebaseapp.com",
            projectId: "meropenem-app",
            storageBucket: "meropenem-app.firebasestorage.app",
            messagingSenderId: "387581088853",
            appId: "1:387581088853:web:2a4e1a37c8372bf20af0dc"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const ordersRef = collection(db, "meropenem_orders");

        // ضبط الوقت التلقائي في خانة الإدخال
        document.getElementById('orderDate').value = new Date().toISOString().slice(0, 16);

        let allOrders = [];

        // إضافة طلب جديد
        document.getElementById('orderForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('patientName').value.trim();
            const ward = document.getElementById('ward').value.trim();
            const date = document.getElementById('orderDate').value;

            try {
                await addDoc(ordersRef, {
                    patientName: name,
                    ward: ward,
                    orderDate: date,
                    status: 'pending', // pending, confirmed, rejected
                    notes: '',
                    createdAt: new Date()
                });
                document.getElementById('orderForm').reset();
                document.getElementById('orderDate').value = new Date().toISOString().slice(0, 16);
                alert('تمت إضافة الطلب بنجاح');
            } catch (err) {
                alert('حدث خطأ أثناء الإضافة: ' + err.message);
            }
        });

        // استماع وتحديث البيانات لحظياً
        const q = query(ordersRef, orderBy("createdAt", "desc"));
        onSnapshot(q, (snapshot) => {
            allOrders = [];
            snapshot.forEach((doc) => {
                allOrders.push({ id: doc.id, ...doc.data() });
            });
            renderOrders();
        });

        // عرض البيانات مع الفلترة
        window.renderOrders = () => {
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            const wardVal = document.getElementById('wardFilter').value.toLowerCase();
            const dateVal = document.getElementById('dateFilter').value;

            const filtered = allOrders.filter(o => {
                const matchName = o.patientName.toLowerCase().includes(searchVal);
                const matchWard = o.ward.toLowerCase().includes(wardVal);
                const matchDate = dateVal ? o.orderDate.startsWith(dateVal) : true;
                return matchName && matchWard && matchDate;
            });

            const tbody = document.getElementById('ordersTableBody');
            if (filtered.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">لا توجد نتائج مطابقة</td></tr>';
                return;
            }

            tbody.innerHTML = filtered.map(o => {
                let statusBadge = '<span class="status-badge status-pending"><i class="bi bi-clock"></i> بانتظار العينة</span>';
                if (o.status === 'confirmed') statusBadge = '<span class="status-badge status-done"><i class="bi bi-check-circle"></i> تم أخذ العينة ✅</span>';
                if (o.status === 'rejected') statusBadge = '<span class="status-badge status-rejected"><i class="bi bi-x-circle"></i> لم ترسل عينة ❌</span>';

                const formattedDate = new Date(o.orderDate).toLocaleString('ar-IQ', { dateStyle: 'short', timeStyle: 'short' });

                return `
                    <tr>
                        <td><strong>${o.patientName}</strong></td>
                        <td><span class="badge bg-secondary">${o.ward}</span></td>
                        <td><small>${formattedDate}</small></td>
                        <td>${statusBadge}</td>
                        <td><small class="text-muted">${o.notes || '-'}</small></td>
                        <td>
                            <button class="btn btn-sm btn-success me-1" onclick="updateStatus('${o.id}', 'confirmed')"><i class="bi bi-check"></i> تأكيد</button>
                            <button class="btn btn-sm btn-danger me-1" onclick="updateStatus('${o.id}', 'rejected')"><i class="bi bi-x"></i> نفي</button>
                        </td>
                    </tr>
                `;
            }).join('');
        };

        // تحديث حالة العينة من قبل المختبر
        window.updateStatus = async (id, status) => {
            const note = prompt(status === 'confirmed' ? 'أدخل ملاحظة (اختياري - مثل: تم سحب عينة دم):' : 'سبب عدم التنزيل/الارسال (اختياري):');
            if (note === null) return; // cancel

            const orderDoc = doc(db, "meropenem_orders", id);
            await updateDoc(orderDoc, {
                status: status,
                notes: note
            });
        };

        // أحداث البحث
        document.getElementById('searchInput').addEventListener('input', renderOrders);
        document.getElementById('wardFilter').addEventListener('input', renderOrders);
        document.getElementById('dateFilter').addEventListener('change', renderOrders);

        window.resetFilters = () => {
            document.getElementById('searchInput').value = '';
            document.getElementById('wardFilter').value = '';
            document.getElementById('dateFilter').value = '';
            renderOrders();
        };
    </script>
</body>
</html>
