<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MeroTrack - الإحصائيات والتقارير</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body { background-color: #f4f6f9; font-family: system-ui, -apple-system, sans-serif; padding-bottom: 40px; }
        .header-title { background: linear-gradient(135deg, #0d6efd, #0a58ca); color: white; padding: 18px 0; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .card { border-radius: 14px; border: none; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 15px; }
        .kpi-card { background: white; border-radius: 12px; padding: 15px; text-align: center; box-shadow: 0 2px 6px rgba(0,0,0,0.04); border-top: 4px solid #0d6efd; }
        .kpi-value { font-size: 1.5rem; font-weight: 800; color: #333; margin-top: 5px; }
        .kpi-label { font-size: 0.8rem; color: #6c757d; font-weight: 600; }
        @media print {
            .no-print { display: none !important; }
            body { background: white; }
            .card { box-shadow: none; border: 1px solid #ddd; }
        }
    </style>
</head>
<body>

    <div class="header-title text-center">
        <h4 class="mb-1"><i class="bi bi-bar-chart-fill"></i> تقارير وإحصائيات الميروبينيم</h4>
        <p class="mb-0 fs-7 opacity-75">مؤشرات الأداء وتحليل استهلاك العينات والأطباء</p>
    </div>

    <div class="container">
        <!-- زر العودة وشريط التحكم -->
        <div class="d-flex justify-content-between align-items-center mb-3 no-print">
            <a href="index.html" class="btn btn-sm btn-outline-secondary">
                <i class="bi bi-arrow-right"></i> العودة للسجل الرئيسي
            </a>
            <button class="btn btn-sm btn-success" onclick="window.print()">
                <i class="bi bi-printer-fill"></i> طباعة / حفظ PDF
            </button>
        </div>

        <!-- فلتر الشهر والسنة -->
        <div class="card p-3 no-print">
            <div class="row g-2 align-items-center">
                <div class="col-8">
                    <label class="form-label fs-7 fw-bold mb-1">اختر الشهر والسنة للتقرير:</label>
                    <input type="month" id="reportMonth" class="form-control form-control-sm">
                </div>
                <div class="col-4 d-flex align-items-end">
                    <button class="btn btn-sm btn-primary w-100 mt-4" onclick="loadAnalytics()">تحديث</button>
                </div>
            </div>
        </div>

        <!-- بطاقات المؤشرات (KPIs) -->
        <div class="row g-2 mb-3">
            <div class="col-6 col-md-3">
                <div class="kpi-card" style="border-top-color: #0d6efd;">
                    <div class="kpi-label">إجمالي الطلبات</div>
                    <div class="kpi-value text-primary" id="totalOrders">0</div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="kpi-card" style="border-top-color: #198754;">
                    <div class="kpi-label">العينات المؤكدة ✅</div>
                    <div class="kpi-value text-success" id="confirmedCount">0 <span class="fs-7 font-monospace" id="confirmedPercent">(0%)</span></div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="kpi-card" style="border-top-color: #dc3545;">
                    <div class="kpi-label">العينات المنفية ❌</div>
                    <div class="kpi-value text-danger" id="rejectedCount">0 <span class="fs-7 font-monospace" id="rejectedPercent">(0%)</span></div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="kpi-card" style="border-top-color: #ffc107;">
                    <div class="kpi-label">بانتظار العينة ⏳</div>
                    <div class="kpi-value text-warning" id="pendingCount">0 <span class="fs-7 font-monospace" id="pendingPercent">(0%)</span></div>
                </div>
            </div>
        </div>

        <!-- الرسوم البيانية -->
        <div class="row g-3">
            <!-- توزيع الحالات -->
            <div class="col-12 col-md-4">
                <div class="card p-3 text-center">
                    <h6 class="text-secondary mb-3">توزيع نسب الحالات</h6>
                    <div style="max-height: 230px; display: flex; justify-content: center;">
                        <canvas id="statusPieChart"></canvas>
                    </div>
                </div>
            </div>
            <!-- الطلبات حسب الأطباء -->
            <div class="col-12 col-md-4">
                <div class="card p-3 text-center">
                    <h6 class="text-secondary mb-3">أكثر الأطباء طالباً للميروبينيم</h6>
                    <div style="max-height: 230px; display: flex; justify-content: center;">
                        <canvas id="doctorsBarChart"></canvas>
                    </div>
                </div>
            </div>
            <!-- الطلبات حسب الردهات -->
            <div class="col-12 col-md-4">
                <div class="card p-3 text-center">
                    <h6 class="text-secondary mb-3">الطلبات حسب الردهات</h6>
                    <div style="max-height: 230px; display: flex; justify-content: center;">
                        <canvas id="wardsBarChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase Script لجمع الإحصائيات -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCqm16V1ESpEbZZ8SJA8GTzFdtbexrPwaE",
            authDomain: "meropenem-app.firebaseapp.com",
            projectId: "meropenem-app",
            storageBucket: "meropenem-app.firebasestorage.app",
            messagingSenderId: "387581088853",
            appId: "1:387581088853:web:2a4e1a37c8372bf20af0dc"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const ordersRef = collection(db, "meropenem_orders");

        let allData = [];
        let pieChartInstance = null;
        let wardsChartInstance = null;
        let doctorsChartInstance = null;

        const now = new Date();
        const currentYearMonth = now.toISOString().slice(0, 7);
        document.getElementById('reportMonth').value = currentYearMonth;

        async function fetchAllData() {
            try {
                const q = query(ordersRef, orderBy("createdAt", "desc"));
                const snapshot = await getDocs(q);
                allData = [];
                snapshot.forEach(doc => {
                    allData.push(doc.data());
                });
                loadAnalytics();
            } catch (err) {
                console.error("Error fetching analytics data:", err);
            }
        }

        window.loadAnalytics = () => {
            const selectedMonth = document.getElementById('reportMonth').value;
            if (!selectedMonth) return;

            const filteredOrders = allData.filter(o => o.orderDate && o.orderDate.startsWith(selectedMonth));

            const total = filteredOrders.length;
            const confirmed = filteredOrders.filter(o => o.status === 'confirmed').length;
            const rejected = filteredOrders.filter(o => o.status === 'rejected').length;
            const pending = filteredOrders.filter(o => o.status === 'pending').length;

            document.getElementById('totalOrders').innerText = total;
            document.getElementById('confirmedCount').innerHTML = `${confirmed} <span class="fs-7 font-monospace text-muted">(${total ? Math.round((confirmed/total)*100) : 0}%)</span>`;
            document.getElementById('rejectedCount').innerHTML = `${rejected} <span class="fs-7 font-monospace text-muted">(${total ? Math.round((rejected/total)*100) : 0}%)</span>`;
            document.getElementById('pendingCount').innerHTML = `${pending} <span class="fs-7 font-monospace text-muted">(${total ? Math.round((pending/total)*100) : 0}%)</span>`;

            // إحصائيات الردهات
            const wardsCount = {};
            // إحصائيات الأطباء
            const doctorsCount = {};

            filteredOrders.forEach(o => {
                const w = o.ward ? o.ward.trim() : 'أخرى';
                wardsCount[w] = (wardsCount[w] || 0) + 1;

                const docName = o.doctorName ? o.doctorName.trim() : 'غير محدد';
                doctorsCount[docName] = (doctorsCount[docName] || 0) + 1;
            });

            updateCharts(confirmed, rejected, pending, wardsCount, doctorsCount);
        };

        function updateCharts(confirmed, rejected, pending, wardsCount, doctorsCount) {
            // 1. رسم الدائرة النسبية
            const pieCtx = document.getElementById('statusPieChart').getContext('2d');
            if (pieChartInstance) pieChartInstance.destroy();
            pieChartInstance = new Chart(pieCtx, {
                type: 'doughnut',
                data: {
                    labels: ['مؤكدة ✅', 'منفية ❌', 'معلقة ⏳'],
                    datasets: [{
                        data: [confirmed, rejected, pending],
                        backgroundColor: ['#198754', '#dc3545', '#ffc107']
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
            });

            // 2. رسم أعمدة الردهات
            const wardsCtx = document.getElementById('wardsBarChart').getContext('2d');
            if (wardsChartInstance) wardsChartInstance.destroy();
            wardsChartInstance = new Chart(wardsCtx, {
                type: 'bar',
                data: {
                    labels: Object.keys(wardsCount).length ? Object.keys(wardsCount) : ['لا توجد بيانات'],
                    datasets: [{
                        label: 'الطلبات',
                        data: Object.values(wardsCount).length ? Object.values(wardsCount) : [0],
                        backgroundColor: '#0d6efd',
                        borderRadius: 6
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } }
            });

            // 3. رسم أعمدة الأطباء
            const docsCtx = document.getElementById('doctorsBarChart').getContext('2d');
            if (doctorsChartInstance) doctorsChartInstance.destroy();
            doctorsChartInstance = new Chart(docsCtx, {
                type: 'bar',
                data: {
                    labels: Object.keys(doctorsCount).length ? Object.keys(doctorsCount) : ['لا توجد بيانات'],
                    datasets: [{
                        label: 'الطلبات',
                        data: Object.values(doctorsCount).length ? Object.values(doctorsCount) : [0],
                        backgroundColor: '#20c997',
                        borderRadius: 6
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } }
            });
        }

        fetchAllData();
    </script>
</body>
</html>
