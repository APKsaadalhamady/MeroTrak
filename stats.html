<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام تتبع طلبات الميروبينيم - MeroTrak</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f8fafc;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-10">

    <header class="bg-gradient-to-r from-teal-600 to-cyan-700 text-white shadow-md p-4 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-3">
            <div class="flex items-center gap-2">
                <span class="text-2xl">💊</span>
                <h1 class="text-lg sm:text-xl font-bold">تتبع طلبات الميروبينيم</h1>
            </div>
            <div class="flex flex-wrap items-center gap-2 w-full sm:w-auto justify-end">
                <select id="reportTypeSelect" onchange="toggleReportType()" class="bg-white/15 text-white border border-white/30 rounded-lg px-3 py-1.5 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-white">
                    <option value="monthly" class="text-slate-800">تقرير شهري 📅</option>
                    <option value="yearly" class="text-slate-800">تقرير سنوي 📆</option>
                </select>
                <input type="month" id="monthInput" onchange="fetchAllData()" class="bg-white/15 text-white border border-white/30 rounded-lg px-3 py-1.5 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-white">
                <select id="yearSelect" onchange="fetchAllData()" class="bg-white/15 text-white border border-white/30 rounded-lg px-3 py-1.5 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-white hidden">
                    </select>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-3 sm:p-5 space-y-4">

        <section class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden transition-all duration-300">
            <button onclick="toggleCollapsible('statsContainer', 'statsChevron')" class="w-full flex justify-between items-center p-4 bg-slate-50/50 hover:bg-slate-100/60 transition text-right">
                <div class="flex items-center gap-2">
                    <span class="text-teal-600 text-lg">📊</span>
                    <span class="font-bold text-sm sm:text-base text-slate-700">الملخص الإحصائي والنسب العامة</span>
                </div>
                <svg id="statsChevron" class="w-5 h-5 text-slate-500 transform transition-transform duration-300 rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                </svg>
            </button>
            <div id="statsContainer" class="p-4 grid grid-cols-2 sm:grid-cols-4 gap-3 border-t border-slate-100">
                <div class="bg-teal-50/60 border border-teal-100 p-3 rounded-xl text-center">
                    <span class="block text-xs text-teal-600 font-semibold mb-1">إجمالي الطلبات</span>
                    <span id="totalRequestsCount" class="text-lg sm:text-xl font-bold text-teal-700">0</span>
                </div>
                <div class="bg-emerald-50/60 border border-emerald-100 p-3 rounded-xl text-center">
                    <span class="block text-xs text-emerald-600 font-semibold mb-1">تم إرسال عينات</span>
                    <span id="sentSamplesCount" class="text-lg sm:text-xl font-bold text-emerald-700">0</span>
                </div>
                <div class="bg-amber-50/60 border border-amber-100 p-3 rounded-xl text-center">
                    <span class="block text-xs text-amber-600 font-semibold mb-1">بانتظار الإرسال</span>
                    <span id="pendingSamplesCount" class="text-lg sm:text-xl font-bold text-amber-700">0</span>
                </div>
                <div class="bg-rose-50/60 border border-rose-100 p-3 rounded-xl text-center">
                    <span class="block text-xs text-rose-600 font-semibold mb-1">بدون عينات (عام)</span>
                    <span id="noSamplesPercentage" class="text-lg sm:text-xl font-bold text-rose-700">0%</span>
                </div>
            </div>
        </section>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                <h2 class="text-xs sm:text-sm font-bold text-slate-700 mb-3 flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-teal-500"></span> توزيع الطلبات حسب الردهات
                </h2>
                <div class="relative h-48 sm:h-56">
                    <canvas id="wardsBarChart"></canvas>
                </div>
            </div>

            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                <h2 class="text-xs sm:text-sm font-bold text-slate-700 mb-3 flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-cyan-500"></span> الطلبات حسب الأطباء المعالجين
                </h2>
                <div class="relative h-48 sm:h-56">
                    <canvas id="doctorsBarChart"></canvas>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
            <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                <h2 class="font-bold text-sm sm:text-base text-slate-700">سجل الطلبات الأخير</h2>
                <span class="text-xs text-slate-500 bg-slate-200 px-2.5 py-1 rounded-full font-medium" id="tableCountBadge">0 طلب</span>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-right text-xs sm:text-sm">
                    <thead class="bg-slate-100/70 text-slate-600 font-semibold">
                        <tr>
                            <th class="p-3">اسم المريض</th>
                            <th class="p-3">الردهة</th>
                            <th class="p-3">الطبيب</th>
                            <th class="p-3">حالة العينة</th>
                            <th class="p-3">التاريخ</th>
                        </tr>
                    </thead>
                    <tbody id="requestsTableBody" class="divide-y divide-slate-100">
                        <tr>
                            <td colspan="5" class="p-4 text-center text-slate-400">جاري تحميل البيانات...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <script>
        let wardsChartInstance = null;
        let doctorsChartInstance = null;

        // تهيئة حقول التاريخ عند التحميل
        window.addEventListener('DOMContentLoaded', () => {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            document.getElementById('monthInput').value = `${year}-${month}`;
            
            // تعبئة خيارات السنوات
            const yearSelect = document.getElementById('yearSelect');
            for (let y = year; y >= year - 3; y--) {
                const opt = document.createElement('option');
                opt.value = y;
                opt.textContent = y;
                yearSelect.appendChild(opt);
            }
            yearSelect.value = year;

            fetchAllData();
        });

        // التبديل بين تقرير شهري وسنوي
        function toggleReportType() {
            const type = document.getElementById('reportTypeSelect').value;
            const monthInput = document.getElementById('monthInput');
            const yearSelect = document.getElementById('yearSelect');

            if (type === 'monthly') {
                monthInput.classList.remove('hidden');
                yearSelect.classList.add('hidden');
            } else {
                monthInput.classList.add('hidden');
                yearSelect.classList.remove('hidden');
            }
            fetchAllData();
        }

        // دالة طي/إظهار الإحصائيات (Collapsible)
        function toggleCollapsible(containerId, chevronId) {
            const container = document.getElementById(containerId);
            const chevron = document.getElementById(chevronId);
            
            if (container.classList.contains('hidden')) {
                container.classList.remove('hidden');
                chevron.classList.add('rotate-180');
            } else {
                container.classList.add('hidden');
                chevron.classList.remove('rotate-180');
            }
        }

        // جلب وتحديث البيانات (افتراضي أو ربط مع GitHub API لاحقاً)
        function fetchAllData() {
            // بيانات تجريبية للعرض التوضيحي وضمان صحة الواجهة
            const sampleData = [
                { patient: "أحمد محمد علي", ward: "باطنية مردة", doctor: "د. سيف", status: "تم إرسال عينة", date: "2026-08-10 10:30" },
                { patient: "فاطمة حسن كاظم", ward: "العناية المركزة ICU", doctor: "د. زينب", status: "لم ترسل عينة (مرفوض)", date: "2026-08-09 14:15" },
                { patient: "محسن عبد اللطيف", ward: "جراحة عامة", doctor: "د. أحمد", status: "بانتظار الإرسال", date: "2026-08-08 09:00" },
                { patient: "زينب جاسم", ward: "باطنية مردة", doctor: "د. سيف", status: "تم إرسال عينة", date: "2026-08-07 11:20" }
            ];

            updateUI(sampleData);
        }

        function updateUI(data) {
            const total = data.length;
            const sent = data.filter(d => d.status.includes('تم إرسال')).length;
            const pending = data.filter(d => d.status.includes('بانتظار')).length;
            const noSampleGeneral = total - sent; // الطلبات بدون إرسال عينات بشكل عام (بما فيها المرفوض أو غيره)
            const noSamplePercentage = total > 0 ? Math.round((noSampleGeneral / total) * 100) : 0;

            // تحديث البطاقات
            document.getElementById('totalRequestsCount').textContent = total;
            document.getElementById('sentSamplesCount').textContent = sent;
            document.getElementById('pendingSamplesCount').textContent = pending;
            document.getElementById('noSamplesPercentage').textContent = `${noSamplePercentage}%`;
            document.getElementById('tableCountBadge').textContent = `${total} طلب`;

            // تحديث الجدول
            const tbody = document.getElementById('requestsTableBody');
            tbody.innerHTML = '';
            
            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-slate-400">لا توجد بيانات مسجلة لهذه الفتره</td></tr>`;
                return;
            }

            data.forEach(item => {
                let badgeClass = 'bg-slate-100 text-slate-700';
                if (item.status.includes('تم إرسال')) badgeClass = 'bg-emerald-50 text-emerald-700 border border-emerald-200';
                else if (item.status.includes('مرفوض')) badgeClass = 'bg-rose-50 text-rose-700 border border-rose-200';
                else badgeClass = 'bg-amber-50 text-amber-700 border border-amber-200';

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="p-3 font-semibold text-slate-700">${item.patient}</td>
                    <td class="p-3 text-slate-600">${item.ward}</td>
                    <td class="p-3 text-slate-600">${item.doctor}</td>
                    <td class="p-3"><span class="px-2.5 py-1 rounded-full text-xs font-semibold inline-block ${badgeClass}">${item.status}</span></td>
                    <td class="p-3 text-slate-400 text-xs">${item.date}</td>
                `;
                tbody.appendChild(tr);
            });

            // إعداد تجميع الرسوم البيانية
            const wardsCount = {};
            const doctorsCount = {};
            data.forEach(i => {
                wardsCount[i.ward] = (wardsCount[i.ward] || 0) + 1;
                doctorsCount[i.doctor] = (doctorsCount[i.doctor] || 0) + 1;
            });

            renderCharts(wardsCount, doctorsCount);
        }

        function renderCharts(wardsCount, doctorsCount) {
            // رسم الردهات
            const wardsCtx = document.getElementById('wardsBarChart').getContext('2d');
            if (wardsChartInstance) wardsChartInstance.destroy();
            wardsChartInstance = new Chart(wardsCtx, {
                type: 'bar',
                data: {
                    labels: Object.keys(wardsCount),
                    datasets: [{
                        label: 'الطلبات',
                        data: Object.values(wardsCount),
                        backgroundColor: '#0d9488',
                        borderRadius: 6
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } }
            });

            // رسم الأطباء
            const docsCtx = document.getElementById('doctorsBarChart').getContext('2d');
            if (doctorsChartInstance) doctorsChartInstance.destroy();
            doctorsChartInstance = new Chart(docsCtx, {
                type: 'bar',
                data: {
                    labels: Object.keys(doctorsCount),
                    datasets: [{
                        label: 'الطلبات',
                        data: Object.values(doctorsCount),
                        backgroundColor: '#0891b2',
                        borderRadius: 6
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } }
            });
        }
    </script>
</body>
</html>
